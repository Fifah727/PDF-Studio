[project]
name = "pdf-studio"
version = "1.3.0"
description = "PDF Studio : organiser, compresser, signer, numéroter, filigraner et protéger des PDF, en local."
readme = "README.md"
authors = [{ name = "Fifaliana Sarobidy" }]
requires-python = ">=3.10"
dependencies = [
  "flet==1.0.3",
  "pypdf==5.9.0",
  "Pillow==12.2.0",
  "cryptography>=43",
]

# Configuration de `flet build` (windows / macos / linux / apk / aab / ipa).
[tool.flet]
org = "mg.pdfstudio"
product = "PDF Studio"
company = "Fifaliana Sarobidy"
copyright = "Copyright (C) 2026 Fifaliana Sarobidy"

[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.3"
