name: Build PDF Studio

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Que construire ?"
        type: choice
        options:
          - android
          - windows
          - both
        default: android
      build_number:
        description: "Numéro de build"
        type: string
        default: "1"

jobs:
  build-android:
    if: inputs.target == 'android' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: echo y | flet build apk --build-number ${{ inputs.build_number }} --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-APK
          path: build/apk/*.apk

  build-windows:
    if: inputs.target == 'windows' || inputs.target == 'both'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows
        run: |
          "y" | flet build windows --build-number ${{ inputs.build_number }} --verbose

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: build/windows
