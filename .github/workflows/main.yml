name: Build PDF Studio

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: flet build apk --build-number 1 --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-APK
          path: build/apk/*.apk

  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      FLET_CLI_NO_RICH_OUTPUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Windows
        run: |
          "y" | flet build windows --build-number 1 --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: build/windows
