name: Build Flet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Construire APK
        run: |
          flet build apk

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/apk/*.apk
